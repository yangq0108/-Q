<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>셀프등기 도우미</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root {
    color-scheme: light;
    --primary: #1D4ED8;
    --primary-container: #EFF6FF;
    --ink: #0F172A;
    --secondary: #64748B;
    --neutral: #F8FAFC;
    --surface: #FFFFFF;
    --border: #E2E8F0;
    --amber: #B45309;
    --amber-container: #FFFBEB;
    --amber-border: #FCD34D;
    --success: #15803D;
    --success-container: #F0FDF4;
    --type-sale: #2563EB;         --type-sale-c: #EFF6FF;
    --type-mortgage: #16A34A;     --type-mortgage-c: #F0FDF4;
    --type-jeonse: #7C3AED;       --type-jeonse-c: #F5F3FF;
    --type-gift: #DB2777;         --type-gift-c: #FDF2F8;
    --type-inheritance: #475569;  --type-inheritance-c: #F1F5F9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--neutral);
    color: var(--ink);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  a { color: inherit; }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 48px 24px;
  }
  .wrap.wizard-wrap { padding-top: 24px; }
  .badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    color: var(--primary);
    background: var(--primary-container);
    border-radius: 999px;
    padding: 4px 12px;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 16px;
  }
  .lead {
    color: var(--secondary);
    font-size: 18px;
    line-height: 1.7;
    margin: 0 0 32px;
  }
  .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--primary);
    color: #fff;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    padding: 14px 24px;
    font-size: 15px;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 8px 20px rgba(29, 78, 216, 0.22);
    transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
  }
  .btn-primary:hover { background: #1e40af; transform: translateY(-1px); box-shadow: 0 10px 24px rgba(29, 78, 216, 0.28); }
  .notice {
    margin-top: 24px;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    font-size: 14px;
    color: var(--secondary);
  }
  section { margin-top: 56px; }
  h2 { font-size: 19px; font-weight: 800; margin: 0 0 16px; letter-spacing: -0.01em; }
  .grid2 {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  @media (min-width: 640px) {
    .grid2 { grid-template-columns: 1fr 1fr; }
  }
  .card {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 14px;
    padding: 16px;
  }
  .card .title { font-weight: 700; color: var(--ink); }
  .card .desc { font-size: 13.5px; color: var(--secondary); margin-top: 4px; line-height: 1.55; }
  button.card-btn {
    all: unset;
    box-sizing: border-box;
    display: block;
    width: 100%;
    cursor: pointer;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 14px;
    padding: 16px;
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
  }
  button.card-btn:hover {
    border-color: var(--card-accent, var(--primary));
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(15, 23, 42, 0.08);
  }
  .card-head { display: flex; align-items: flex-start; gap: 12px; }
  .card-text { flex: 1; min-width: 0; }
  .card-top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .type-icon {
    flex-shrink: 0;
    width: 42px;
    height: 42px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    background: var(--card-accent-bg, var(--primary-container));
  }
  .tag-pill {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .tag-pill.primary { color: var(--primary); background: var(--primary-container); }
  .tag-pill.success { color: var(--success); background: var(--success-container); }
  .option-dot {
    flex-shrink: 0;
    margin-top: 2px;
    width: 18px;
    height: 18px;
    border-radius: 999px;
    border: 2px solid #cbd5e1;
    transition: border-color 0.15s;
  }
  button.card-btn:hover .option-dot { border-color: var(--primary); }
  ul.plain { padding-left: 20px; color: var(--secondary); margin: 0; }
  ul.plain li { margin-bottom: 6px; }

  .panel {
    margin-top: 16px;
    border: 1px solid #e2e8f0;
    background: #fff;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .back-link {
    font-size: 14px;
    color: #94a3b8;
    text-decoration: none;
  }
  .back-link:hover { color: #475569; }
  .progress-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
    font-size: 12px;
  }
  .progress-row .type-label { color: var(--card-accent, var(--primary)); font-weight: 700; }
  .progress-row .count { color: #94a3b8; }
  .q-title { font-size: 20px; font-weight: 700; margin: 4px 0 8px; }
  .q-help { color: #64748b; font-size: 14px; margin: 0 0 24px; }
  .option-list { display: grid; gap: 12px; margin-bottom: 8px; }

  .result-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .result-title { font-size: 20px; font-weight: 800; margin: 2px 0 0; }
  .result-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-sm {
    font-size: 13px;
    padding: 7px 12px;
    border-radius: 10px;
    border: 1px solid #e2e8f0;
    background: #fff;
    cursor: pointer;
  }
  .btn-sm:hover { background: #f8fafc; }
  .btn-sm.dark { background: #0f172a; color: #fff; border-color: #0f172a; }
  .btn-sm.dark:hover { background: #334155; }

  .who-line { font-size: 14px; color: #64748b; margin-bottom: 24px; }
  .who-line b { color: #334155; font-weight: 600; }

  .warning-box {
    border: 1px solid #fcd34d;
    background: #fffbeb;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 32px;
  }
  .warning-box .w-title { font-weight: 700; color: #92400e; margin-bottom: 8px; }
  .warning-box ul { margin: 0; padding-left: 18px; color: #78350f; font-size: 14px; }
  .warning-box li { margin-bottom: 6px; }

  .section-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
  }
  .section-head .count { font-size: 14px; color: #94a3b8; }

  .doc-group { margin-bottom: 20px; }
  .doc-group:last-child { margin-bottom: 0; }
  .doc-group-label {
    font-size: 13px;
    font-weight: 700;
    color: #1d4ed8;
    margin-bottom: 8px;
  }
  .doc-list {
    list-style: none;
    margin: 0; padding: 0;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    overflow: hidden;
    background: #fff;
  }
  .doc-list > li {
    display: flex;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid #f1f5f9;
  }
  .doc-list > li:last-child { border-bottom: none; }
  .doc-list input { margin-top: 3px; width: 16px; height: 16px; flex-shrink: 0; }
  .doc-label { font-weight: 500; color: #0f172a; }
  .doc-label.done { text-decoration: line-through; color: #94a3b8; }
  .doc-note { font-size: 13px; color: #64748b; margin-top: 2px; }

  ol.step-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  ol.step-list > li {
    display: flex;
    gap: 12px;
    border: 1px solid #e2e8f0;
    background: #fff;
    border-radius: 14px;
    padding: 12px 14px;
  }
  .step-num {
    flex-shrink: 0;
    width: 24px; height: 24px;
    border-radius: 999px;
    background: #2563eb;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .step-body { flex: 1; min-width: 0; }
  .step-title { font-weight: 600; color: #0f172a; }
  .step-desc { font-size: 14px; color: #64748b; margin-top: 2px; }
  .step-details {
    margin: 10px 0 0;
    padding: 10px 14px 10px 28px;
    background: #f8fafc;
    border-radius: 10px;
    font-size: 13.5px;
    color: #475569;
  }
  .step-details li { margin-bottom: 5px; }
  .step-details li:last-child { margin-bottom: 0; }
  .step-checklist { margin-top: 10px; }
  .step-checklist-label { font-size: 12px; font-weight: 700; color: var(--primary); margin-bottom: 6px; }
  .step-checklist .doc-list { border-radius: 10px; }
  .doc-note a, .step-desc a, .step-details a, .warning-box a {
    color: #1d4ed8;
    text-decoration: underline;
  }

  .deepdive-trigger {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 10px;
    font-size: 12.5px;
    font-weight: 600;
    color: #1d4ed8;
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 8px;
    padding: 5px 10px;
    cursor: pointer;
  }
  .deepdive-trigger:hover { background: #dbeafe; }

  /* 결과 화면: 왼쪽에 전체 체크리스트, 오른쪽에는 화면 전체 높이를 쓰는 "자세히 보기" 전용 패널 */
  .wizard-wrap.wrap-wide { max-width: 1360px; }
  .result-grid { display: block; }
  @media (min-width: 1100px) {
    .result-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 380px;
      gap: 24px;
      align-items: start;
    }
  }
  .detail-rail { margin-top: 24px; }
  @media (min-width: 1100px) {
    .detail-rail {
      margin-top: 0;
      position: sticky;
      top: 24px;
      height: calc(100vh - 48px);
    }
  }
  .detail-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    height: 100%;
  }
  .detail-placeholder {
    color: var(--secondary);
    font-size: 13px;
    text-align: center;
    padding: 24px 20px;
    line-height: 1.6;
  }
  .deepdive-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    padding: 16px 16px 10px;
    border-bottom: 1px solid #f1f5f9;
    flex-shrink: 0;
  }
  .deepdive-head[hidden] { display: none; }
  .deepdive-title { font-weight: 700; font-size: 15px; color: #0f172a; }
  .deepdive-close {
    border: none;
    background: none;
    cursor: pointer;
    color: #94a3b8;
    font-size: 20px;
    line-height: 1;
    padding: 0 4px;
    flex-shrink: 0;
  }
  .deepdive-close:hover { color: #475569; }
  .deepdive-body { flex: 1; padding: 14px 16px 20px; overflow-y: auto; font-size: 13.5px; color: #334155; }
  .deepdive-body[hidden] { display: none; }
  .deepdive-body ol { margin: 0 0 14px; padding-left: 18px; }
  .deepdive-body li { margin-bottom: 9px; line-height: 1.55; }
  .deepdive-sections { display: flex; flex-direction: column; gap: 16px; margin-bottom: 4px; }
  .deepdive-section-title { font-size: 12px; font-weight: 700; color: var(--primary, #1d4ed8); margin-bottom: 6px; }
  .deepdive-section ul { margin: 0; padding-left: 18px; }
  .deepdive-section li { margin-bottom: 8px; line-height: 1.55; }
  .deepdive-section li:last-child { margin-bottom: 0; }
  .deepdive-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .deepdive-links a {
    font-size: 12.5px;
    font-weight: 600;
    color: #1d4ed8;
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 8px;
    padding: 6px 10px;
    text-decoration: none;
  }
  .deepdive-links a:hover { background: #dbeafe; }

  /* 인지세·국민주택채권 매입기준율표처럼 구간별 수치를 나열하는 정보를 긴 문장 대신 표로 보여준다 */
  .dd-table-wrap { margin-bottom: 18px; }
  .dd-table-wrap:last-child { margin-bottom: 4px; }
  .dd-table-title { font-size: 12px; font-weight: 700; color: var(--primary, #1d4ed8); margin-bottom: 6px; }
  .dd-table-scroll { overflow-x: auto; border: 1px solid #e2e8f0; border-radius: 10px; background: #fff; }
  table.dd-table { width: 100%; border-collapse: collapse; font-size: 12.5px; white-space: nowrap; }
  table.dd-table th, table.dd-table td { padding: 7px 10px; border-bottom: 1px solid #f1f5f9; }
  table.dd-table th:first-child, table.dd-table td:first-child { text-align: left; white-space: normal; }
  table.dd-table thead th { background: #eff6ff; color: #1d4ed8; font-weight: 700; text-align: right; }
  table.dd-table thead th:first-child { text-align: left; }
  table.dd-table td { text-align: right; color: #334155; }
  table.dd-table td:first-child { color: #0f172a; font-weight: 500; }
  table.dd-table tbody tr:last-child td { border-bottom: none; }
  table.dd-table tbody tr:hover td { background: #f8fafc; }
  .dd-table-note { font-size: 12px; color: #64748b; margin-top: 8px; line-height: 1.5; }

  /* 거래금액·시가표준액을 입력하면 인지세·채권매입액을 바로 계산해주는 미니 계산기 */
  .dd-calc {
    border: 1px solid #bfdbfe;
    background: var(--primary-container, #eff6ff);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 18px;
  }
  .dd-calc-title { font-size: 12.5px; font-weight: 700; color: var(--primary, #1d4ed8); margin-bottom: 10px; }
  .dd-calc-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .dd-calc-row:last-of-type { margin-bottom: 0; }
  .dd-calc-row label { font-size: 12.5px; color: #334155; flex-shrink: 0; width: 92px; }
  .dd-calc-input-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 6px;
    background: #fff;
    border: 1px solid #bfdbfe;
    border-radius: 8px;
    padding: 0 10px;
  }
  .dd-calc-input {
    flex: 1;
    border: none;
    outline: none;
    padding: 8px 0;
    font-size: 13.5px;
    font-family: inherit;
    min-width: 0;
    text-align: right;
  }
  .dd-calc-unit { font-size: 12.5px; color: #64748b; flex-shrink: 0; }
  .dd-calc-select {
    flex: 1;
    border: 1px solid #bfdbfe;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13.5px;
    font-family: inherit;
    background: #fff;
    color: #0f172a;
  }
  .dd-calc-result {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed #bfdbfe;
    font-size: 13px;
    color: #64748b;
    line-height: 1.5;
  }
  .dd-calc-result b { display: block; font-size: 18px; color: #0f172a; margin-bottom: 2px; }
  .dd-calc-sub { display: block; font-size: 12px; color: #64748b; }

  /* 1100px 미만(모바일 포함)에서는 오른쪽 고정 사이드바 대신, 눌렀을 때만 뜨는 바텀시트 모달로 보여준다.
     그냥 본문 아래에 이어붙이면 페이지 맨 밑까지 스크롤해야 보여서 모바일에서 "먹통"처럼 느껴지기 때문. */
  @media (max-width: 1099.98px) {
    .detail-rail { display: none; }
    .detail-rail.dd-open {
      display: flex;
      position: fixed;
      inset: 0;
      z-index: 500;
      align-items: flex-end;
      justify-content: center;
      background: rgba(15, 23, 42, 0.45);
      margin: 0;
      padding: 0;
    }
    .detail-rail.dd-open .detail-card {
      width: 100%;
      max-width: 560px;
      max-height: min(80vh, 640px);
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -12px 32px rgba(15, 23, 42, 0.28);
    }
  }

  /* 잔금날 흐름 등 "장소 이동"을 보여주는 아이콘 타임라인 (사이트 화면을 흉내내지 않는 순수 도식만 유지) */
  .mock-timeline { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; align-items: flex-start; }
  .mock-timeline .stop { flex: 1; min-width: 68px; text-align: center; }
  .mock-timeline .stop .ico {
    width: 30px; height: 30px; border-radius: 50%; background: #eff6ff; border: 1.5px solid #bfdbfe;
    display: flex; align-items: center; justify-content: center; margin: 0 auto 4px; font-size: 14px;
  }
  .mock-timeline .stop .lbl { font-size: 10.5px; color: #475569; line-height: 1.3; }
  .mock-timeline .arrow { align-self: center; color: #cbd5e1; font-size: 14px; padding-top: 4px; }

  .footnote {
    font-size: 12px;
    color: #94a3b8;
    border-top: 1px solid #e2e8f0;
    padding-top: 16px;
    margin-top: 32px;
  }

  @media print {
    .no-print { display: none !important; }
    body { background: #fff; }
  }

  .gate {
    position: fixed;
    inset: 0;
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--neutral);
    padding: 24px;
  }
  .gate[hidden] { display: none; }
  .gate-card {
    width: 100%;
    max-width: 340px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px 28px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
  }
  .gate-card h1 {
    font-size: 20px;
    margin: 0 0 8px;
  }
  .gate-card p {
    font-size: 13.5px;
    color: var(--secondary);
    margin: 0 0 20px;
    line-height: 1.55;
  }
  .gate-input {
    width: 100%;
    box-sizing: border-box;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
    margin-bottom: 12px;
  }
  .gate-input:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
  .gate-card .btn-primary { width: 100%; }
  .gate-error {
    margin-top: 12px;
    font-size: 13px;
    color: #DC2626;
  }
</style>
</head>
<body>
<div id="gate" class="gate">
  <form id="gate-form" class="gate-card">
    <h1>셀프등기 도우미</h1>
    <p>공유받은 비밀번호를 입력하세요.</p>
    <input id="gate-input" class="gate-input" type="password" inputmode="numeric" autocomplete="off" placeholder="비밀번호" autofocus>
    <button type="submit" class="btn-primary">입장</button>
    <div id="gate-error" class="gate-error" hidden>비밀번호가 올바르지 않습니다.</div>
  </form>
</div>
<div id="app" hidden></div>

<script>
/* 이 페이지는 공개 저장소에 그대로 배포되므로, 아래 비밀번호는 검색엔진 노출을 피하기 위한
   간단한 접근 안내용일 뿐 실제 보안 장치가 아니다(페이지 소스를 보면 누구나 확인 가능). */
const GATE_PASSWORD = "2496";
const GATE_STORAGE_KEY = "selfRegistrationGateUnlocked_v1";

function initGate(onUnlock) {
  const gate = document.getElementById("gate");
  const app = document.getElementById("app");
  const form = document.getElementById("gate-form");
  const input = document.getElementById("gate-input");
  const error = document.getElementById("gate-error");

  function unlock() {
    gate.hidden = true;
    app.hidden = false;
    onUnlock();
  }

  let alreadyUnlocked = false;
  try {
    alreadyUnlocked = localStorage.getItem(GATE_STORAGE_KEY) === "1";
  } catch (e) {
    // localStorage를 쓸 수 없는 환경에서는 매번 비밀번호를 입력해야 한다.
  }

  if (alreadyUnlocked) {
    unlock();
    return;
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (input.value === GATE_PASSWORD) {
      try {
        localStorage.setItem(GATE_STORAGE_KEY, "1");
      } catch (e) {}
      error.hidden = true;
      unlock();
    } else {
      error.hidden = false;
      input.select();
    }
  });
}

const TYPE_META = {
  "sale": { icon: "🏠", accent: "var(--type-sale)", accentBg: "var(--type-sale-c)", tag: { text: "가장 많이 찾는 유형", tone: "primary" } },
  "mortgage-cancel": { icon: "🔓", accent: "var(--type-mortgage)", accentBg: "var(--type-mortgage-c)", tag: { text: "난이도 낮음", tone: "success" } },
  "jeonse-set": { icon: "📜", accent: "var(--type-jeonse)", accentBg: "var(--type-jeonse-c)" },
  "gift": { icon: "🎁", accent: "var(--type-gift)", accentBg: "var(--type-gift-c)" },
  "inheritance": { icon: "📑", accent: "var(--type-inheritance)", accentBg: "var(--type-inheritance-c)" }
};
function typeMeta(id) { return TYPE_META[id] || { icon: "📋", accent: "var(--primary)", accentBg: "var(--primary-container)" }; }

function computeChecklist(type, answers) {
  const documents = type.baseDocuments.slice();
  const steps = type.baseSteps.slice();
  const warnings = (type.baseWarnings || []).slice();
  const seenDocIds = new Set(documents.map(d => d.id));
  const seenStepIds = new Set(steps.map(s => s.id));

  type.questions.forEach(q => {
    const answer = answers[q.id];
    if (!answer) return;
    const effect = q.effects[answer];
    if (!effect) return;
    (effect.documents || []).forEach(doc => {
      if (!seenDocIds.has(doc.id)) { documents.push(doc); seenDocIds.add(doc.id); }
    });
    (effect.steps || []).forEach(step => {
      if (!seenStepIds.has(step.id)) { steps.splice(steps.length - 1, 0, step); seenStepIds.add(step.id); }
    });
    (effect.warnings || []).forEach(w => {
      if (warnings.indexOf(w) === -1) warnings.push(w);
    });
  });

  return { documents, steps, warnings };
}

function groupDocumentsByCategory(type, documents) {
  return type.documentCategories
    .map(cat => ({ key: cat.key, label: cat.label, items: documents.filter(d => d.category === cat.key) }))
    .filter(g => g.items.length > 0);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

  "bmtong.co.kr": "https://www.bmtong.co.kr"
};
const SITE_DOMAINS_SORTED = Object.keys(SITE_LINKS).sort((a, b) => b.length - a.length);

// 본문에 등장하는 사이트 도메인 문자열을 실제 하이퍼링크로 바꿔준다.
function linkify(rawText) {
  let out = esc(rawText);
  SITE_DOMAINS_SORTED.forEach(domain => {
    const url = SITE_LINKS[domain];
    const escaped = domain.replace(/[.]/g, "\\.").replace(/-/g, "\\-");
    const re = new RegExp("(?<![\\w./])" + escaped + "(?![\\w/])", "g");
    out = out.replace(re, `<a href="${url}" target="_blank" rel="noopener">${domain}</a>`);
  });
  return out;
}

// 잔금날처럼 "장소 이동" 흐름을 보여주는 아이콘 타임라인 (실제 사이트 화면을 흉내내지 않는 순수 도식)
function mockTimeline(stops) {
  const items = stops.map((s, i) => {
    const stop = `<div class="stop"><div class="ico">${s.icon}</div><div class="lbl">${esc(s.label)}</div></div>`;
    return i < stops.length - 1 ? stop + `<div class="arrow">→</div>` : stop;
  }).join("");
  return `<div class="mock-timeline">${items}</div>`;
}

// 인지세·국민주택채권 계산 로직. 시각화용 표(REGISTRATION_TYPES 안의 tables)와 반드시 같은 수치를 쓴다.
const STAMP_DUTY_BRACKETS = [
  { max: 10000000, amount: 0, label: "1천만원 이하 (면제)" },
  { max: 30000000, amount: 20000, label: "1천만원 초과 ~ 3천만원 이하" },
  { max: 50000000, amount: 40000, label: "3천만원 초과 ~ 5천만원 이하" },
  { max: 100000000, amount: 70000, label: "5천만원 초과 ~ 1억원 이하" },
  { max: 1000000000, amount: 150000, label: "1억원 초과 ~ 10억원 이하" },
  { max: Infinity, amount: 350000, label: "10억원 초과" }
];
function calcStampDuty(amount) {
  return STAMP_DUTY_BRACKETS.find(b => amount <= b.max);
}

const BOND_RATE_TABLES = {
  paid: [ // 매매 등 유상 소유권이전 (주택)
    { min: 20000000, max: 50000000, capital: 13, other: 13, label: "2천만원 이상 ~ 5천만원 미만" },
    { min: 50000000, max: 100000000, capital: 19, other: 14, label: "5천만원 이상 ~ 1억원 미만" },
    { min: 100000000, max: 160000000, capital: 21, other: 16, label: "1억원 이상 ~ 1억6천만원 미만" },
    { min: 160000000, max: 260000000, capital: 23, other: 18, label: "1억6천만원 이상 ~ 2억6천만원 미만" },
    { min: 260000000, max: 600000000, capital: 26, other: 21, label: "2억6천만원 이상 ~ 6억원 미만" },
    { min: 600000000, max: Infinity, capital: 31, other: 26, label: "6억원 이상" }
  ],
  free: [ // 상속·증여 등 무상취득
    { min: 10000000, max: 50000000, capital: 18, other: 14, label: "1천만원 이상 ~ 5천만원 미만" },
    { min: 50000000, max: 150000000, capital: 28, other: 25, label: "5천만원 이상 ~ 1억5천만원 미만" },
    { min: 150000000, max: Infinity, capital: 42, other: 39, label: "1억5천만원 이상" }
  ]
};
// 국민주택채권 최저매입금액은 1만원이며, 1만원 미만 단수는 5천원 이상이면 올리고 미만이면 버린다 (주택도시기금법 시행령 별표 4호)
function roundBondAmount(raw) {
  const remainder = raw % 10000;
  const rounded = remainder === 0 ? raw : (remainder >= 5000 ? raw - remainder + 10000 : raw - remainder);
  return Math.max(rounded, 10000);
}
function calcBond(amount, region, kind) {
  const bracket = BOND_RATE_TABLES[kind].find(b => amount >= b.min && amount < b.max);
  if (!bracket) return null;
  const rate = region === "capital" ? bracket.capital : bracket.other;
  return { rate, label: bracket.label, amount: roundBondAmount(Math.round(amount * rate / 1000)) };
}

function wireCalculators(calculators) {
  (calculators || []).forEach(calc => {
    const id = calc.id;
    const amountEl = document.getElementById(`calc-${id}-amount`);
    const resultEl = document.getElementById(`calc-${id}-result`);
    const regionEl = document.getElementById(`calc-${id}-region`);
    const discountEl = document.getElementById(`calc-${id}-discount`);
    if (!amountEl || !resultEl) return;
    const placeholder = calc.kind === "stamp" ? "거래금액을 입력하면 결과가 여기 표시됩니다." : "시가표준액을 입력하면 결과가 여기 표시됩니다.";
    function update() {
      const digits = amountEl.value.replace(/[^0-9]/g, "");
      if (!digits) { resultEl.textContent = placeholder; return; }
      const amount = Number(digits);
      if (calc.kind === "stamp") {
        const b = calcStampDuty(amount);
        resultEl.innerHTML = `<b>${b.amount ? b.amount.toLocaleString("ko-KR") + "원" : "면제 (납부 대상 아님)"}</b><span class="dd-calc-sub">${esc(b.label)} 구간</span>`;
      } else {
        const kind = calc.kind === "bond-paid" ? "paid" : "free";
        const r = calcBond(amount, regionEl.value, kind);
        if (!r) {
          resultEl.innerHTML = `<span class="dd-calc-sub">시가표준액이 이 표의 최소 구간보다 적습니다 — 매입 대상 여부를 주택도시기금 사이트에서 확인하세요.</span>`;
        } else {
          const discountRaw = discountEl ? discountEl.value.trim() : "";
          const discountPct = discountRaw ? Number(discountRaw) : NaN;
          if (discountRaw && Number.isFinite(discountPct) && discountPct > 0) {
            const burden = Math.round(r.amount * discountPct / 100);
            resultEl.innerHTML = `<b>${burden.toLocaleString("ko-KR")}원</b><span class="dd-calc-sub">즉시매도 시 실제 부담하는 고객부담금 (매입금액 ${r.amount.toLocaleString("ko-KR")}원 × 할인율 ${discountPct}%) · 매입률 ${r.rate}/1000 (${esc(r.label)})</span>`;
          } else {
            resultEl.innerHTML = `<b>${r.amount.toLocaleString("ko-KR")}원</b><span class="dd-calc-sub">매입률 ${r.rate}/1000 (${esc(r.label)}) 적용 매입금액. 위에 오늘자 채권 할인율(%)을 입력하면 실제 고객부담금까지 계산됩니다.</span>`;
          }
        }
      }
    }
    amountEl.addEventListener("input", () => {
      const digits = amountEl.value.replace(/[^0-9]/g, "");
      amountEl.value = digits ? Number(digits).toLocaleString("ko-KR") : "";
      update();
    });
    if (regionEl) regionEl.addEventListener("change", update);
    if (discountEl) discountEl.addEventListener("input", () => {
      discountEl.value = discountEl.value.replace(/[^0-9.]/g, "").replace(/(\..*)\./g, "$1");
      update();
    });
  });
}

const state = { view: "home", typeId: null, questionIndex: 0, answers: {}, checked: {} };

// 답변·체크리스트 상태를 브라우저에 저장해, 다음에 다시 열어도 이어서 볼 수 있게 한다.
const STORAGE_KEY = "selfRegistrationWizardState_v1";

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    // 저장 공간을 쓸 수 없는 환경(프라이빗 모드 등)에서는 그냥 저장을 건너뛴다.
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (!saved || typeof saved !== "object") return;

    const type = saved.typeId ? REGISTRATION_TYPES.find(t => t.id === saved.typeId) : null;
    if (saved.typeId && !type) return; // 예전 버전의 유형 id 등 알 수 없는 데이터는 무시

    let view = saved.view === "select-type" || saved.view === "question" || saved.view === "result" ? saved.view : "home";
    let questionIndex = 0;
    if (view === "question" && type) {
      questionIndex = Number.isInteger(saved.questionIndex) ? saved.questionIndex : 0;
      if (questionIndex < 0 || questionIndex >= type.questions.length) questionIndex = 0;
    }
    if ((view === "question" || view === "result") && !type) view = "home";

    state.view = view;
    state.typeId = type ? saved.typeId : null;
    state.questionIndex = questionIndex;
    state.answers = saved.answers && typeof saved.answers === "object" ? saved.answers : {};
    state.checked = saved.checked && typeof saved.checked === "object" ? saved.checked : {};
  } catch (e) {
    // 저장된 값이 손상되어 있으면 무시하고 처음 화면으로 시작한다.
  }
}

function goHome() {
  state.view = "home";
  state.typeId = null;
  state.questionIndex = 0;
  state.answers = {};
  state.checked = {};
  render();
}

function selectType(typeId) {
  const type = REGISTRATION_TYPES.find(t => t.id === typeId);
  state.typeId = typeId;
  state.answers = {};
  state.checked = {};
  state.questionIndex = 0;
  state.view = type.questions.length > 0 ? "question" : "result";
  render();
}

function answerQuestion(questionId, value) {
  const type = REGISTRATION_TYPES.find(t => t.id === state.typeId);
  state.answers[questionId] = value;
  if (state.questionIndex + 1 < type.questions.length) {
    state.questionIndex += 1;
  } else {
    state.view = "result";
  }
  render();
}

function goBackQuestion() {
  if (state.questionIndex === 0) {
    goHome();
  } else {
    state.questionIndex -= 1;
    render();
  }
}

function toggleDoc(id) {
  state.checked[id] = !state.checked[id];
  render();
}

        <div class="step-title">${esc(s.title)}</div>
        <div class="step-desc">${linkify(s.description)}</div>
        ${s.details && s.details.length ? `<ul class="step-details">${s.details.map(d => `<li>${linkify(d)}</li>`).join("")}</ul>` : ""}
        ${s.checklist && s.checklist.length ? `
        <div class="step-checklist">
          <div class="step-checklist-label">이 단계에서 챙길 것</div>
          <ul class="doc-list">
            ${s.checklist.map((item, ci) => {
              const itemId = `${s.id}__${ci}`;
              return `
              <li>
                <input type="checkbox" class="no-print" data-doc="${esc(itemId)}" ${state.checked[itemId] ? "checked" : ""}>
                <div class="doc-label ${state.checked[itemId] ? "done" : ""}">${linkify(item)}</div>
              </li>`;
            }).join("")}
          </ul>
        </div>` : ""}
        ${s.deepDive ? `<button type="button" class="deepdive-trigger no-print" data-dd="${esc(s.id)}">🔍 화면 흐름 · 자세히 보기</button>` : ""}
      </div>
    </li>
  `).join("");

  const hasDeepDive = checklist.steps.some(s => s.deepDive);
  const m = typeMeta(type.id);
  const mainColumnHtml = `
      <div class="panel">
        <div class="result-header no-print">
          <div class="card-head">
            <div class="type-icon" style="--card-accent-bg:${m.accentBg}">${m.icon}</div>
            <div>
              <span class="badge" style="margin-bottom:6px;color:${m.accent};background:${m.accentBg};">맞춤 체크리스트</span>
              <div class="result-title">${esc(type.title)}</div>
            </div>
          </div>
          <div class="result-actions">
            <button class="btn-sm" id="edit-answers">답변 수정</button>
            <button class="btn-sm" id="print-btn">인쇄/저장</button>
            <button class="btn-sm dark" id="restart-btn">처음부터</button>
          </div>
        </div>

        <p class="who-line"><b>신청 방식: </b>${esc(type.who)}</p>

        ${warningsHtml}

        <h2 class="section-head">
          <span>필요 서류 체크리스트</span>
          <span class="count no-print">${doneCount} / ${checklist.documents.length} 준비됨</span>
        </h2>
        ${groupsHtml}

        <h2 style="margin-top:32px;">진행 절차</h2>
        <ol class="step-list">${stepsHtml}</ol>

        <p class="footnote">이 안내는 일반적인 절차를 요약한 참고 자료이며, 법률·세무 자문을 대체하지 않습니다. 관할 등기소, 대법원 인터넷등기소(iros.go.kr), 위택스(wetax.go.kr), 홈택스(hometax.go.kr)에서 최신 요건을 반드시 다시 확인하세요.</p>
      </div>
  `;

  app.innerHTML = `
    <div class="wrap wizard-wrap ${hasDeepDive ? "wrap-wide" : ""}">
      <a href="#" class="back-link no-print" id="to-home">← 처음으로</a>
      <div class="result-grid">
        ${mainColumnHtml}
        ${hasDeepDive ? `
        <div class="detail-rail no-print" id="detail-rail">
          <div class="detail-card" id="deepdive-panel">
            <div class="detail-placeholder" id="detail-placeholder">
              <div class="icon">🔍</div>
              <div>절차 항목의<br>'화면 흐름 · 자세히 보기'에<br>마우스를 올리거나 클릭하면<br>여기에 자세히 표시돼요.</div>
            </div>
            <div class="deepdive-head" id="deepdive-head" hidden>
                <div class="deepdive-title" id="deepdive-title"></div>
                <button type="button" class="deepdive-close" id="deepdive-close" aria-label="닫기">✕</button>
              </div>
              <div class="deepdive-body" id="deepdive-body" hidden></div>
            </div>
          </div>
          ` : ""}
      </div>
    </div>
  `;
  document.getElementById("to-home").addEventListener("click", e => { e.preventDefault(); goHome(); });
  document.getElementById("edit-answers").addEventListener("click", () => {
    state.questionIndex = 0;
    state.view = "question";
    render();
  });
  document.getElementById("print-btn").addEventListener("click", () => window.print());
  document.getElementById("restart-btn").addEventListener("click", goHome);
  app.querySelectorAll("[data-doc]").forEach(cb => {
    cb.addEventListener("change", () => toggleDoc(cb.getAttribute("data-doc")));
  });
  app.querySelectorAll("[data-step]").forEach(cb => {
    cb.addEventListener("change", () => toggleStep(cb.getAttribute("data-step")));
  });

  if (hasDeepDive) {
    const canHover = window.matchMedia("(hover: hover)").matches;
    app.querySelectorAll("[data-dd]").forEach(btn => {
      const stepId = btn.getAttribute("data-dd");
      btn.addEventListener("click", () => openDeepDive(checklist, stepId));
      if (canHover) btn.addEventListener("mouseenter", () => openDeepDive(checklist, stepId));
    });
    document.getElementById("deepdive-close").addEventListener("click", resetDeepDive);
    document.getElementById("detail-rail").addEventListener("click", (e) => {
      if (e.target.id === "detail-rail") resetDeepDive();
    });
  }
}

function openDeepDive(checklist, stepId) {
  const step = checklist.steps.find(s => s.id === stepId);
  if (!step || !step.deepDive) return;
  const dd = step.deepDive;
  const mockups = dd.mockups || [];
  const topMockup = mockups.length === 1 ? mockups[0] : null;
  const pairedMockups = mockups.length > 1 ? mockups : null;
  const sectionsHtml = dd.sections ? `
    <div class="deepdive-sections">
      ${dd.sections.map(sec => `
        <div class="deepdive-section">
          <div class="deepdive-section-title">${esc(sec.title)}</div>
          <ul>${sec.items.map(it => `<li>${linkify(it)}</li>`).join("")}</ul>
        </div>
      `).join("")}
    </div>
  ` : "";
  const listHtml = dd.list ? `<ol>${dd.list.map((li, i) => `<li>${(pairedMockups && pairedMockups[i]) || ""}${linkify(li)}</li>`).join("")}</ol>` : "";
  const tablesHtml = dd.tables ? dd.tables.map(renderRateTable).join("") : "";
  const calculatorsHtml = dd.calculators ? dd.calculators.map(renderCalculator).join("") : "";
  document.getElementById("deepdive-title").textContent = step.title;
  document.getElementById("deepdive-body").innerHTML = `
    ${topMockup || ""}
    ${calculatorsHtml}
    ${tablesHtml}
    ${sectionsHtml}
    ${listHtml}
    ${dd.links && dd.links.length ? `<div class="deepdive-links">${dd.links.map(l => `<a href="${l.url}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join("")}</div>` : ""}
  `;
  wireCalculators(dd.calculators);
  document.getElementById("detail-placeholder").hidden = true;
  document.getElementById("deepdive-head").hidden = false;
  document.getElementById("deepdive-body").hidden = false;
  const rail = document.getElementById("detail-rail");
  rail.classList.add("dd-open");
  if (window.matchMedia("(max-width: 1099.98px)").matches) {
    document.body.style.overflow = "hidden";
  }
}

function resetDeepDive() {
  const placeholder = document.getElementById("detail-placeholder");
  if (!placeholder) return;
  placeholder.hidden = false;
  document.getElementById("deepdive-head").hidden = true;
  document.getElementById("deepdive-body").hidden = true;
  document.getElementById("detail-rail").classList.remove("dd-open");
  document.body.style.overflow = "";
}

function render() {
  document.body.style.overflow = ""; // 이전 화면에서 모바일 자세히보기 시트가 열려있었다면 스크롤 잠금을 해제한다.
  if (state.view === "home") renderHome();
  else if (state.view === "select-type") renderSelectType();
  else if (state.view === "question") renderQuestion();
  else if (state.view === "result") renderResult();
  saveState();
}

initGate(() => {
  loadState();
  render();
});
</script>
</body>
</html>
